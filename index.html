<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.PNG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f33" />
    <meta name="description" content="معرض البركة للتجارة — الاستعلام عن الأقساط بالرقم القومي أو الموبايل ومتابعة كشف الحساب. الشرقية، مركز صان الحجر." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>معرض البركة للتجارة — الاستعلام عن الأقساط ومتابعة الحساب</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('albaraka-theme')
          if (t && t !== 'default') {
            document.documentElement.classList.add('theme-' + t)
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
